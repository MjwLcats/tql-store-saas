server:
  port: 9202
spring:
  application:
    name: tql-store-operation
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:tql_store_saas}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
management:
  endpoints:
    web:
      exposure:
        include: health,info
wecom:
  notification:
    enabled: ${WECOM_ENABLED:false}
    corp-id: ${WECOM_CORP_ID:}
    corp-secret: ${WECOM_CORP_SECRET:}
    agent-id: ${WECOM_AGENT_ID:0}
    app-base-url: ${WECOM_APP_BASE_URL:}
content:
  ai:
    ollama-base-url: ${CONTENT_AI_OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${CONTENT_AI_MODEL:qwen3:8b}
douyin:
  open-api:
    base-url: https://open.douyin.com
    client-key: ${DOUYIN_CLIENT_KEY:}
    client-secret: ${DOUYIN_CLIENT_SECRET:}
    redirect-uri: ${DOUYIN_REDIRECT_URI:}
    profile-link-expire-days: 7
